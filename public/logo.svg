<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="collab-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect x="2" y="2" width="28" height="28" rx="7" fill="url(#collab-grad)" />
  
  <!-- Collaborative Boxes / Overlapping shapes in the center -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Box 1 (Top Left) -->
    <rect x="8" y="8" width="10" height="10" rx="2" opacity="0.9" />
    <!-- Box 2 (Bottom Right) -->
    <rect x="14" y="14" width="10" height="10" rx="2" opacity="0.95" />
    <!-- Intersection Highlight / Connector -->
    <circle cx="14" cy="14" r="2.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1" />
  </g>
</svg>
